general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    # lock_cmd = playerctl --all-players pause && pidof hyprlock || hyprlock  # pause all system audio and avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

# 8 min sin actividad: salvapantallas (parpadeo → carrusel de próceres → bloqueo → pantalla apagada).
# El bloqueo y el apagado los hace el propio script al terminar la vuelta del carrusel (~5 min),
# así funciona igual cuando se lanza desde el botón de la luna del menú de apagado.
listener {
    timeout = 480
    on-timeout = ~/.config/hypr/scripts/salvapantallas.sh
}

# El script apaga la pantalla un minuto después de bloquear; con cualquier actividad se vuelve a prender.
listener {
    timeout = 60
    on-timeout = true
    on-resume = hyprctl dispatch dpms on
}

