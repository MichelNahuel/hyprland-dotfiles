# Pantalla de bloqueo con el lenguaje de la consola y el salvapantallas:
# crema #e6dfcf, JetBrainsMono, líneas finas y esquinas rectas. La hora usa los
# dígitos de "andamio" (hypr/scripts/reloj-bloqueo.py). Fondo y foto sin cambios.

# Cache Folder
$ml4w_cache_folder = $HOME/.cache/ml4w/hyprland-dotfiles

# Source colors
source = colors.conf

$crema = rgba(e6dfcfff)
$crema_suave = rgba(e6dfcfb3)
$fuente = JetBrainsMono Nerd Font Mono

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = __HOME__/Pictures/pantalla_bloqueo/kcd_fondo.png   # only png supported for now
}

# la foto: marco fino y recto, como el resto de la interfaz
image {
    monitor =
    path = __HOME__/Pictures/pantalla_bloqueo/vault_boy.png
    size = 260
    rounding = 0
    border_size = 2
    border_color = rgba(e6dfcfd9)
    reload_time = -1
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(00000066)
}

# usuario, como el prompt de la consola
label {
    monitor =
    text = └─› $USER
    color = $crema
    font_size = 15
    font_family = $fuente
    position = 0, 20
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

input-field {
    monitor =
    size = 300, 42
    outline_thickness = 1
    rounding = 0
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    dots_rounding = 0                           # puntos cuadrados, como ▪ de la consola
    outer_color = rgba(e6dfcf99)
    inner_color = rgba(0e101459)
    font_color = $crema
    font_family = $fuente
    fade_on_empty = false
    placeholder_text = <span foreground="##e6dfcf99">contraseña</span>
    hide_input = false
    check_color = rgba(e6dfcfff)
    fail_color = rgba(d98a6fff)
    fail_text = contraseña incorrecta · $ATTEMPTS
    capslock_color = rgba(ecc46eff)
    numlock_color = -1
    bothlock_color = rgba(ecc46eff)             # con NumLock prendido (el teclado numérico de la E16) también cuenta
    invert_numlock = false
    swap_font_color = false
    position = 0, -40
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000055)
}

# hora con caracteres de andamio, abajo a la derecha
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/reloj-bloqueo.py
    color = $crema
    font_size = 14
    font_family = $fuente
    position = -60, 70
    halign = right
    valign = bottom
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(000000aa)
}

# fecha debajo de la hora
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/reloj-bloqueo.py fecha
    color = $crema_suave
    font_size = 13
    font_family = $fuente
    position = -64, 36
    halign = right
    valign = bottom
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(000000aa)
}
