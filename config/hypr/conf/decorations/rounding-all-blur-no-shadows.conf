# -----------------------------------------------------
# General window decoration
# name: "Rounding All Blur No Shadows"
# -----------------------------------------------------

decoration {
    rounding = 10
    active_opacity = 0.9
    inactive_opacity = 0.85   # antes 0.6: con una pintura detrás costaba leer una ventana sin foco
    fullscreen_opacity = 0.9

    blur {
        enabled = true
        size = 3
        passes = 4
        new_optimizations = on
        ignore_opacity = true
        xray = true
    }

    shadow {
        enabled = false
        range = 30
        render_power = 3
        color = 0x66000000
    }
}

layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace nwg-dock
layerrule = ignore_alpha 0.05, match:namespace nwg-dock