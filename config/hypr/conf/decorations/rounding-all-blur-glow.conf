# -----------------------------------------------------
# General window decoration
# name: "Rounding All Blur Glow" (como "Rounding All Blur No Shadows" pero con una sombra de
# color que solo se ve en la ventana activa, a modo de halo, en vez de la sombra gris de siempre)
# -----------------------------------------------------

decoration {
    rounding = 10
    active_opacity = 0.9
    inactive_opacity = 0.85
    fullscreen_opacity = 0.9

    blur {
        enabled = true
        size = 3
        passes = 4
        new_optimizations = on
        ignore_opacity = true
        xray = true
    }

    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = $primary
        color_inactive = rgba(00000000)
    }
}

layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace nwg-dock
layerrule = ignore_alpha 0.05, match:namespace nwg-dock
