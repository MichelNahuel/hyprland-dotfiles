# Add your additional Hyprland configurations here

# LED de micrófono: apagado cuando el micrófono está muteado
exec-once = ~/.config/hypr/scripts/mic-led.sh

# No mover el cursor al centro de la ventana al enfocarla (ej. desde el dock)
cursor {
    no_warps = true
}

# Blur para notificaciones translúcidas (sintaxis nueva; ml4w.conf usa layerrule2)
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.05, match:namespace swaync-notification-window
# Sin xray: mostrar difuminado lo que hay detrás (ventanas), no solo el wallpaper
layerrule = xray off, match:namespace swaync-notification-window

# Escala del panel interno al 100%: usa los 1920x1200 reales en vez de 1280x800.
# Entra bastante más contenido y el logo de la consola no se deforma, porque la
# escala multiplica ancho y alto por igual y la celda de kitty conserva su
# proporción. Quitá esta línea para volver al valor por defecto (1.5).
monitor = eDP-1,preferred,auto,1

# Blur para el lanzador, igual que las notificaciones: sin esto, una
# translucidez tan alta lo deja ilegible sobre la pintura.
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.05, match:namespace rofi
layerrule = xray off, match:namespace rofi

# Un solo lanzador: antes Super+Espacio abría wofi (sin tematizar, con el aspecto
# GTK por defecto) y Super+Ctrl+Enter abría rofi. Ahora los dos abren el mismo.
# Va acá y no en keybinding.conf porque hypr/scripts/keybindings.sh lee ese
# archivo esperando UNA sola línea con el source, y la convierte en una ruta:
# cualquier línea de más deja el menú de atajos vacío.
bind = SUPER, Space, exec, pkill rofi || rofi -show drun -replace -i


# Salvapantallas (hypr/scripts/salvapantallas.sh): el ojo que se abre difumina
# lo que hay detrás, y la ventana del carrusel es opaca y sin animación de apertura.
layerrule = blur on, match:namespace despertar
layerrule = ignore_alpha 0.12, match:namespace despertar
layerrule = xray off, match:namespace despertar
windowrule = opaque on, match:class salvapantallas
windowrule = no_anim on, match:class salvapantallas
# el carrusel se abre en un escritorio especial, que se dibuja encima de todo (también de un video a pantalla completa)
windowrule = workspace special:salvapantallas silent, match:class salvapantallas
# Un video a pantalla completa no dispara el salvapantallas (inhibe la inactividad)
windowrule = idle_inhibit fullscreen, match:class ^(firefox|mpv|vlc|chromium|brave-browser|org.gnome.Totem)$

# Super+L: salvapantallas al irse (parpadeo → carrusel → bloqueo). Super+Ctrl+L sigue bloqueando directo.
bind = SUPER, L, exec, ~/.config/hypr/scripts/salvapantallas.sh

# Deslizar con tres dedos a los costados en el touchpad: escritorio anterior / siguiente,
# de a uno y sin saltear los vacíos (workspace_swipe_use_r: 1 → 2 → 3 aunque el 2 no tenga ventanas)
# (el layout "laptop" de ML4W trae la misma línea: si se elige ese layout, borrar esta para no duplicarla)
gesture = 3, horizontal, workspace
gestures {
    workspace_swipe_use_r = true
}

# Tres dedos hacia abajo: pantalla completa de la ventana activa (y si ya está,
# la saca). Es el mismo dispatcher que usa Super+F (fullscreen real, no maximizar).
gesture = 3, down, fullscreen, 0

# Tres dedos hacia arriba: el mismo selector de ventanas/escritorios de Super+Tab
# (overview de Quickshell/ML4W), para elegir un workspace abierto o vacío.
gesture = 3, up, dispatcher, exec, qs -p $HOME/.config/quickshell/overview ipc call overview toggle
