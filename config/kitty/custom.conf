# Personalización propia: ML4W incluye este archivo al final de kitty.conf,
# así que estos valores reemplazan a los de arriba. Los colores siguen
# viniendo de matugen (colors-matugen.conf).

# Tamaño de letra (ML4W traía 6; se probaron 10, 9, 8 y 7.5)
font_size 7

# Más aire alrededor del texto (antes 10)
window_padding_width 18

# Cursor en barra fina
cursor_shape beam
cursor_beam_thickness 1.5
